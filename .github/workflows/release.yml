name: Release

# Builds the installer from a tag, signs it, and publishes it along with the file the running
# application reads to discover updates.
#
# ## What has to line up for an update to install
#
# `src-tauri/tauri.conf.json` names two things: an endpoint,
# `https://github.com/beastops/beastube/releases/latest/download/latest.json`, and the public half
# of the updater key. An installed copy fetches that JSON, compares versions, downloads the
# installer it names, and checks its signature against the compiled-in public key before running
# any of it.
#
# So a release is only usable if all three arrive together: the installer, its `.sig`, and a
# `latest.json` pointing at both. `tauri-action` writes all three when `TAURI_SIGNING_PRIVATE_KEY`
# is present, and silently omits the signature when it is not — which produces a release that looks
# complete and that no existing installation will accept. The guard below fails loudly instead.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, e.g. v0.1.0. It must already exist.'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    permissions:
      # Creating the release and uploading assets to it.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Without the key the bundler still produces an installer, just no `.sig` — a release that
      # looks complete and that every installed copy refuses. So the build never proceeds without
      # one. What differs is how loudly that is said, and by whom it was asked for.
      #
      # Asked for by hand, silence would be the wrong answer: someone is waiting on a release and
      # needs to know why there isn't one. Reached by pushing a tag, a hard failure is noise — this
      # project is released from a workstation, so every tag push left a red run behind it for a
      # condition that is neither new nor a fault. Six of them in a row said nothing except that
      # nobody had added a secret.
      - name: Look for the signing key
        id: key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop, because there is no signing key
        if: steps.key.outputs.present == 'false' && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set."
          echo "Without it the bundler still produces an installer, but no .sig — and every"
          echo "installed copy refuses an update it cannot verify. See docs/RELEASING.md."
          exit 1

      - name: Skip, because there is no signing key
        if: steps.key.outputs.present == 'false' && github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          echo "::notice::No signing key, so this tag was not built here."
          echo "That is the expected path while releases are cut from a workstation:"
          echo "see the manual section of docs/RELEASING.md. Add"
          echo "TAURI_SIGNING_PRIVATE_KEY to the repository secrets to build them here instead."

      - name: Check the tag matches the version being built
        if: steps.key.outputs.present == 'true'
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          # `tauri.conf.json` is the one that decides what the built binary reports, and therefore
          # what the updater compares against. Checking only package.json would pass a release
          # whose actual version is stale. All three are checked so they cannot drift apart.
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag  tauri.conf.json=$conf  package.json=$pkg  Cargo.toml=$crate"
          if [ "$tag" != "v$conf" ] || [ "$conf" != "$pkg" ] || [ "$conf" != "$crate" ]; then
            echo "::error::Version mismatch. The tag, tauri.conf.json, package.json and Cargo.toml must all agree."
            echo "The updater compares the version compiled into the binary — which comes from"
            echo "tauri.conf.json — not the name of the tag."
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        if: steps.key.outputs.present == 'true'

      - uses: actions/setup-node@v7
        if: steps.key.outputs.present == 'true'
        with:
          # Pinned rather than read from `engines.node`, which is a range and would resolve to
          # whatever Node is newest on the day the release is cut.
          node-version: '24.18.0'
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.key.outputs.present == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.key.outputs.present == 'true'

      - name: Install dependencies
        if: steps.key.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Fetch bundled tools
        if: steps.key.outputs.present == 'true'
        run: pnpm tools:fetch

      - uses: tauri-apps/tauri-action@v1
        if: steps.key.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The contents of the key, not a path to it. `TAURI_SIGNING_PRIVATE_KEY_PATH` is
          # documented but does not work: a build given the path fails with "public key found but
          # no private key", which is a confusing way to say it never read the file.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'BEASTUBE __VERSION__'
          releaseBody: |
            Windows installer below. It carries `yt-dlp` and `ffmpeg`, so downloads work on a
            machine with nothing else installed.

            Existing installations update themselves: BEASTUBE checks this release, verifies the
            signature against the key compiled into it, and installs without a wizard.

            See the full notes in [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
          # A draft, so the person releasing reads the notes and presses publish. The updater
          # endpoint resolves `/releases/latest/`, which ignores drafts — so nothing is offered to
          # anyone until that press.
          releaseDraft: true
          prerelease: false

      - name: Confirm the update manifest was produced
        if: steps.key.outputs.present == 'true'
        shell: bash
        run: |
          # `latest.json` is the file the updater actually reads. Its absence is the one failure
          # that leaves a release looking perfectly fine and updating nobody.
          if ! ls target/release/bundle/nsis/*.sig >/dev/null 2>&1; then
            echo "::error::No .sig beside the installer; the release would be unusable for updates."
            exit 1
          fi
          if ! ls target/release/bundle/msi/*.msi >/dev/null 2>&1; then
            echo "::error::No .msi produced. WiX may have failed to download; see the bundler output."
            exit 1
          fi
          echo "Signed artefacts:"
          ls -la target/release/bundle/nsis/ target/release/bundle/msi/

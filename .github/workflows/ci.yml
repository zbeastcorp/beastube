name: CI

# Every check the project documents, run on the platform it ships for.
#
# BEASTUBE is a Windows desktop application, so `windows-latest` is not a preference — the shell
# links against WebView2 and the download subsystem drives Windows-specific process APIs. A Linux
# runner would be cheaper and would not compile.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a branch makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Cargo's own network retries, so a flaky registry is not a red build.
  CARGO_NET_RETRY: 3

jobs:
  frontend:
    name: Front end
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned, not `node-version-file`. That reads `engines.node`, which is a *range*
          # (`>=22.12.0`), and a range resolves to whatever is newest — so CI would follow every
          # Node major on its own and break on one of them with no commit to blame.
          node-version: '22.12.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Test
        run: pnpm test

  rust:
    name: Rust
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Keyed on the lockfile: a dependency change invalidates it, a source change does not.
      - uses: Swatinem/rust-cache@v2

      # Not optional here either, and this is not obvious. `beastube-app`'s build script runs
      # `tauri_build::build()`, which resolves the `resources` globs in `tauri.conf.json` — so a
      # workspace with no `src-tauri/binaries/*.exe` fails to *compile*, not merely to bundle:
      #
      #   glob pattern binaries/*.exe path not found or didn't match any files
      #
      # Verified by hiding the directory and running `cargo check -p beastube-app`. Without this
      # step both clippy and the tests fail on a fresh checkout, which is every first run.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: pnpm

      - name: Fetch bundled tools
        run: pnpm tools:fetch

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  build:
    name: Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned, not `node-version-file`. That reads `engines.node`, which is a *range*
          # (`>=22.12.0`), and a range resolves to whatever is newest — so CI would follow every
          # Node major on its own and break on one of them with no commit to blame.
          node-version: '22.12.0'
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Not optional. `yt-dlp` and `ffmpeg` are bundled as installer resources, and the bundler
      # fails if they are absent — so a build that skipped this would only fail later, and less
      # clearly. Each download is checked against a vendor checksum by the script itself.
      - name: Fetch bundled tools
        run: pnpm tools:fetch

      # Unsigned on purpose. This proves the tree still builds; it does not produce anything
      # installable, because an artefact this workflow signed would be signed by a key that lives
      # in a pull request's environment. Releases are signed in `release.yml`, from a tag.
      - name: Build
        run: pnpm tauri build --no-bundle
